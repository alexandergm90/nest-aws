name: Build & Deploy (Azure VM)

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/nestapp:${{ env.IMAGE_TAG }}
            ${{ secrets.ACR_LOGIN_SERVER }}/nestapp:latest

      - name: Deploy on VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            docker pull ${{ secrets.ACR_LOGIN_SERVER }}/nestapp:${{ env.IMAGE_TAG }}
            docker rm -f nestapp || true
            docker run -d \
              --name nestapp \
              --restart=always \
              -p 80:3000 \
              ${{ secrets.ACR_LOGIN_SERVER }}/nestapp:${{ env.IMAGE_TAG }}
